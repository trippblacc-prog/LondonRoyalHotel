
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard | Louisiana Hotels & Suites</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="dashboard-header">
        <div class="header-content">
            <img src="images/Louisiana-hotel-logo.png" alt="Louisiana Hotels & Suites">
            <button id="logout-btn">Log Out</button>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="welcome-section">
            <h1>Management Dashboard</h1>
            <p>Manage apartment availability at Louisiana Hotels & Suites.</p>
        </section>

        <section class="availability-section">
            <div class="section-heading">
                <h2>Apartment Availability</h2>
                <p>Change an apartment's booking status below.</p>
            </div>

            <div id="apartment-list" class="apartment-list">
                <p>Loading apartment information...</p>
            </div>

            <p id="dashboard-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
